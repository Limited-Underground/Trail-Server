services:
  trail-server-api:
    build:
      context: ../..
      dockerfile: server/TrailServer.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      TrailServer__InstanceName: ts002-development
      TrailServer__RadioBridge__Enabled: "false"
      TrailServer__RadioBridge__Transport: disabled
    ports:
      - "127.0.0.1:5080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
