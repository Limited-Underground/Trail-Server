name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash -n deploy/host/install-host.sh deploy/host/verify-host.sh deploy/host/files/trail-server-kiosk
      - run: npm test
