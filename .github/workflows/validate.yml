name: Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-prototype:
    name: Public prototype
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Install dependencies
        run: npm ci
      - name: Validate shell syntax
        run: bash -n deploy/host/install-host.sh deploy/host/verify-host.sh deploy/host/files/trail-server-kiosk deploy/app/install-app.sh deploy/app/verify-app.sh
      - name: Run complete validation
        run: npm test
